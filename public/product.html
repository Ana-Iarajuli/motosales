<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#03070b">
  <script>try { document.documentElement.dataset.theme = localStorage.getItem('theme') || 'tron'; } catch { document.documentElement.dataset.theme = 'tron'; }</script>
  <title>Deal details — MotoSales</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Exo+2:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="logo" href="./" aria-label="MotoSales home"><svg class="logo-icon" viewBox="0 0 100 70" fill="none" aria-hidden="true"><line class="logo-slash" x1="82" y1="10" x2="16" y2="62" stroke="currentColor" stroke-width="1.2"/><g transform="translate(49 36) rotate(33.7) scale(0.84)" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M41 -7 L23 -21 L8 -18 C2 -17 -2 -13 -8 -12 L-24 -14 L-36 -17" stroke-width="2.4"/><path d="M37 -3 L22 -6 L6 4 L-14 4 L-21 -5" stroke-width="2"/><path d="M29 -13 L11 -11 L-3 -3" stroke-width="2.8"/><path d="M30 0 L25 -13 M-30 0 L-13 2" stroke-width="1.8"/><circle cx="-30" cy="0" r="11" stroke-width="2.8"/><circle cx="-30" cy="0" r="4.5" stroke-width="1.4"/><circle cx="30" cy="0" r="11" stroke-width="2.8"/><circle cx="30" cy="0" r="4.5" stroke-width="1.4"/></g></svg><span class="logo-word">Moto<span>Sales</span></span></a>
      <form class="header-search" action="./" role="search">
        <input name="q" type="search" placeholder="Search helmets, jackets, brands…" aria-label="Search deals" autocomplete="off">
      </form>
      <label class="currency-switch">
        <span class="sr-only">Currency</span>
        <select id="currency"></select>
      </label>
      <div class="theme-picker">
        <button type="button" class="theme-btn" id="theme-btn" aria-haspopup="menu" aria-expanded="false" aria-label="Change theme"></button>
        <div class="theme-menu" id="theme-menu" role="menu" hidden></div>
      </div>
    </div>
  </header>

  <main class="wrap" id="product"></main>

  <footer class="site-footer">
    <div class="wrap">
      <p>MotoSales compares prices only — purchases happen on each store's own website. Prices and stock are checked periodically and may have changed; always confirm on the store's page.</p>
    </div>
  </footer>

  <script type="module" src="js/product.js"></script>
</body>
</html>
